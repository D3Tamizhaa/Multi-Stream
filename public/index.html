<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multi Stream Studio</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app" id="app">

    <!-- ===================== TOP HEADER ===================== -->
    <header class="app-header">
      <div class="header-left">
        <button class="menu-btn" id="menu-btn" aria-haspopup="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          Menu
        </button>
        <div class="dropdown left hidden" id="menu-dropdown">
          <a href="#/editor" data-nav="editor">Editor</a>
          <div class="sub-label">Settings</div>
          <a href="#/settings/authorization" data-nav="settings">Authorization</a>
          <a href="#/settings/stream" data-nav="settings">Stream</a>
          <a href="#/settings/output" data-nav="settings">Output</a>
          <a href="#/settings/audio" data-nav="settings">Audio</a>
          <a href="#/settings/video" data-nav="settings">Video</a>
          <a href="#/settings/advanced" data-nav="settings">Advanced</a>
        </div>
      </div>
      <div class="header-center">Multi Stream Studio</div>
      <div class="header-right">
        <button class="user-menu-btn" id="user-menu-btn">
          <span class="user-avatar" id="user-avatar">A</span>
          <span id="username-label">admin</span>
        </button>
        <div class="dropdown right hidden" id="user-dropdown">
          <a href="#/settings/authorization" id="user-menu-username">admin</a>
          <hr />
          <button id="logout-btn">Logout</button>
        </div>
      </div>
    </header>

    <div class="app-body" id="app-body">
      <!-- ===================== EDITOR VIEW ===================== -->
      <div class="editor-view" id="editor-view">

        <!-- Main Workspace -->
        <div class="workspace-row">
          <div class="workspace-canvas" id="workspace-canvas"></div>
<div class="workspace-preview-toggle">
  <label class="preview-checkbox" for="preview-toggle">
    <input type="checkbox" id="preview-toggle" checked />
    <span>Preview</span>
  </label>
</div>
        </div>

        <!-- Production Panels: Scenes / Sources / Audio Mixer -->
        <div class="panels-row">
          <section class="panel" id="scenes-panel">
            <div class="panel-title"><span>Scenes</span></div>
            <div class="panel-body" id="scenes-list"></div>
            <div class="panel-toolbar">
              <button class="icon-btn" id="scene-add" title="Add Scene">+</button>
              <button class="icon-btn" id="scene-remove" title="Remove Scene">−</button>
              <button class="icon-btn" id="scene-up" title="Move Up">↑</button>
              <button class="icon-btn" id="scene-down" title="Move Down">↓</button>
              <button class="icon-btn" id="scene-props" title="Properties">⚙</button>
            </div>
          </section>

          <section class="panel" id="sources-panel">
            <div class="panel-title"><span>Sources</span></div>
            <div class="panel-body" id="sources-list"></div>
            <div class="panel-toolbar">
              <button class="icon-btn" id="source-add" title="Add Source">+</button>
              <button class="icon-btn" id="source-remove" title="Remove Source">−</button>
              <button class="icon-btn" id="source-lock" title="Lock/Unlock">🔒</button>
              <button class="icon-btn" id="source-show" title="Show/UnShow">👁</button>
              <button class="icon-btn" id="source-up" title="Move Up">↑</button>
              <button class="icon-btn" id="source-down" title="Move Down">↓</button>
              <button class="icon-btn" id="source-props" title="Properties">⚙</button>
            </div>
          </section>

          <section class="panel" id="audio-panel">
            <div class="panel-title"><span>Audio Mixer</span></div>
            <div class="panel-body" id="audio-mixer-list"></div>
          </section>
        </div>

        <!-- Streaming Controls: Platforms / Controls -->
        <div class="controls-row">
          <section class="panel" id="platforms-panel">
            <div class="panel-title"><span>Platforms</span></div>
            <div class="panel-body" id="platforms-list"></div>
            <div class="panel-toolbar">
              <button class="icon-btn" id="platform-add" title="Add Platform">+</button>
              <button class="icon-btn" id="platform-remove" title="Remove Platform">−</button>
            </div>
          </section>

          <section class="panel" id="controls-panel">
            <div class="panel-title"><span>Controls</span></div>
            <div class="controls-panel-body">
              <button class="stream-toggle-btn" id="stream-toggle">Start Streaming</button>
              <div class="stream-error hidden" id="stream-error"></div>
            </div>
          </section>
        </div>

        <!-- Bottom Status Bar: Usage -->
        <div class="status-bar">
          <div class="status-item">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-label">Offline</span>
          </div>
          <div class="status-item">Uptime: <span class="val" id="uptime-val">00:00:00</span></div>
        </div>
      </div>

      <!-- ===================== SETTINGS VIEW ===================== -->
      <div class="settings-view hidden" id="settings-view">
        <nav class="settings-nav" id="settings-nav">
          <a href="#/settings/authorization" data-settings-nav="authorization">Authorization</a>
          <a href="#/settings/stream" data-settings-nav="stream">Stream</a>
          <a href="#/settings/output" data-settings-nav="output">Output</a>
          <a href="#/settings/audio" data-settings-nav="audio">Audio</a>
          <a href="#/settings/video" data-settings-nav="video">Video</a>
          <a href="#/settings/advanced" data-settings-nav="advanced">Advanced</a>
        </nav>
        <div class="settings-content" id="settings-content"></div>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="/js/api.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/workspace.js"></script>
  <script src="/js/panels.js"></script>
  <script src="/js/modals.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
